<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Expenses chart component</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="left-section">
        <p>My balance</p>
        <strong>$921.48</strong>
      </div>
      <div class="right-section">
        <img src="./images/logo.svg" alt="log" />
      </div>
    </header>
    <main>
      <h1>Spending - Last 7 days</h1>
      <section class="bar-section"> 
        <div class="bar mon">
          <p class="amount">$0</p>
          <div class="bar-fill"></div>
          <p class="day">mon</p>
        </div>

        <div class="bar tue">
          <p class="amount">$0</p>
          <div class="bar-fill"></div>
          <p class="day">tue</p>
        </div>

        <div class="bar wed">
          <p class="amount">$0</p>
          <div class="bar-fill"></div>
          <p class="day">wed</p>
        </div>

        <div class="bar thu">
          <p class="amount">$0</p>
          <div class="bar-fill"></div>
          <p class="day">thu</p>
        </div>

        <div class="bar fri">
          <p class="amount">$0</p>
          <div class="bar-fill"></div>
          <p class="day">fri</p>
        </div>

        <div class="bar sat">
          <p class="amount">$0</p>
          <div class="bar-fill"></div>
          <p class="day">sat</p>
        </div>

        <div class="bar sun">
          <p class="amount">$0</p>
          <div class="bar-fill"></div>
          <p class="day">sun</p>
        </div>
      </section>
      <hr />
      <section class="total-section">
        <div class="left-section">
          <strong>Total this month</strong>
          <h2>$478.33</h2>
        </div>
        <div class="right-section">
          <strong> +2.4% </strong>
          <p>from last month</p>
        </div>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Vincent</a>.
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
